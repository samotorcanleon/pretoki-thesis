name: pretoki
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=1.26
  - pandas=2.2
  - xarray=2025.1
  - dask=2024.6
  - scipy=1.14
  - scikit-learn=1.5
  - netcdf4
  - pyarrow=16
  - openpyxl=3.1
  - pyyaml
  - joblib
  - tqdm
  - multiprocess=0.70
  - gin-config=0.5
  - wandb=0.19
  - shap=0.46
  - matplotlib=3.9
  - seaborn=0.13
  - ipywidgets=8
  - jupyterlab=4
  # ALADIN preprocessing and maps
  - cfgrib=0.9
  - eccodes
  - xesmf=0.8
  - esmpy=8.4
  - cartopy=0.23
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.5.1
